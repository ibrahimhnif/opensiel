# Template only. Create the real secret out of band (see README), never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: opensiel-secrets
  namespace: opensiel
type: Opaque
stringData:
  DATABASE_URL: postgres://opensiel:change-me@postgres.opensiel.svc.cluster.local:5432/opensiel
  OPENSIEL_MASTER_KEY: <openssl rand -base64 32>
  OPENSIEL_JWT_SECRET: <openssl rand -hex 32>
  OPENSIEL_PUBLIC_URL: https://opensiel.liostech.id
  OPENSIEL_ALLOW_SIGNUP: "false"
