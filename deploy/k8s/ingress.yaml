apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensiel
  namespace: opensiel
spec:
  ingressClassName: traefik
  rules:
    - host: opensiel.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensiel
                port:
                  number: 8787
