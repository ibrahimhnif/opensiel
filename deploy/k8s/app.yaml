apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensiel
  namespace: opensiel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensiel
  template:
    metadata:
      labels:
        app: opensiel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensiel
          # Replace OWNER with the GitHub user or organization that published the image.
          image: ghcr.io/OWNER/opensiel:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8787"
            - name: HOST
              value: 0.0.0.0
            - name: OPENSIEL_WEB_DIR
              value: apps/web/dist
          envFrom:
            - secretRef:
                name: opensiel-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: opensiel
  namespace: opensiel
spec:
  selector:
    app: opensiel
  ports:
    - name: http
      port: 8787
      targetPort: http
