services:
  db:
    image: postgres:16-alpine
    container_name: opensiel-db
    environment:
      POSTGRES_USER: opensiel
      POSTGRES_PASSWORD: opensiel
      POSTGRES_DB: opensiel
    ports:
      - "55432:5432"
    volumes:
      - opensiel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensiel -d opensiel"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: opensiel-app
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://opensiel:opensiel@db:5432/opensiel
      OPENSIEL_MASTER_KEY: ${OPENSIEL_MASTER_KEY:?set OPENSIEL_MASTER_KEY}
      OPENSIEL_MASTER_KEY_VERSION: ${OPENSIEL_MASTER_KEY_VERSION:-1}
      OPENSIEL_MASTER_KEY_NEXT: ${OPENSIEL_MASTER_KEY_NEXT:-}
      OPENSIEL_MASTER_KEY_NEXT_VERSION: ${OPENSIEL_MASTER_KEY_NEXT_VERSION:-}
      OPENSIEL_KMS_KEY_ID: ${OPENSIEL_KMS_KEY_ID:-}
      OPENSIEL_KMS_WRAPPED_MASTER_KEY: ${OPENSIEL_KMS_WRAPPED_MASTER_KEY:-}
      OPENSIEL_KMS_REGION: ${OPENSIEL_KMS_REGION:-us-east-1}
      OPENSIEL_KMS_ENDPOINT: ${OPENSIEL_KMS_ENDPOINT:-}
      OPENSIEL_KMS_ACCESS_KEY_ID: ${OPENSIEL_KMS_ACCESS_KEY_ID:-}
      OPENSIEL_KMS_SECRET_ACCESS_KEY: ${OPENSIEL_KMS_SECRET_ACCESS_KEY:-}
      OPENSIEL_SAML_ENTRY_POINT: ${OPENSIEL_SAML_ENTRY_POINT:-}
      OPENSIEL_SAML_ISSUER: ${OPENSIEL_SAML_ISSUER:-}
      OPENSIEL_SAML_IDP_CERT: ${OPENSIEL_SAML_IDP_CERT:-}
      OPENSIEL_SAML_CALLBACK_URL: ${OPENSIEL_SAML_CALLBACK_URL:-}
      OPENSIEL_SAML_AUDIENCE: ${OPENSIEL_SAML_AUDIENCE:-}
      OPENSIEL_SAML_ALLOWED_DOMAINS: ${OPENSIEL_SAML_ALLOWED_DOMAINS:-}
      OPENSIEL_SAML_AUTO_CREATE: ${OPENSIEL_SAML_AUTO_CREATE:-true}
      OPENSIEL_JWT_SECRET: ${OPENSIEL_JWT_SECRET:?set OPENSIEL_JWT_SECRET}
      OPENSIEL_PUBLIC_URL: ${OPENSIEL_PUBLIC_URL:-http://localhost:8787}
      OPENSIEL_WEB_DIR: apps/web/dist
      OPENSIEL_ALLOW_SIGNUP: ${OPENSIEL_ALLOW_SIGNUP:-false}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  opensiel-db:
