{{- if and .Values.secrets.existingSecret .Values.postgresql.enabled }}
{{- fail "secrets.existingSecret requires postgresql.enabled=false; put DATABASE_URL in the existing Secret and use an external database" }}
{{- end }}

{{- if not .Values.secrets.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "opensiel.fullname" .) -}}

{{- $masterKey := .Values.secrets.masterKey -}}
{{- if not $masterKey -}}
{{- if $existing -}}
{{- if hasKey $existing.data "OPENSIEL_MASTER_KEY" -}}
{{- $masterKey = index $existing.data "OPENSIEL_MASTER_KEY" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $masterKey -}}
{{- $masterKey = randAlphaNum 32 | b64enc -}}
{{- end -}}
{{- end -}}

{{- $jwtSecret := .Values.secrets.jwtSecret -}}
{{- if not $jwtSecret -}}
{{- if $existing -}}
{{- if hasKey $existing.data "OPENSIEL_JWT_SECRET" -}}
{{- $jwtSecret = index $existing.data "OPENSIEL_JWT_SECRET" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $jwtSecret -}}
{{- $jwtSecret = randAlphaNum 64 -}}
{{- end -}}
{{- end -}}

{{- $dbPassword := .Values.postgresql.auth.password -}}
{{- if .Values.postgresql.enabled -}}
{{- if not $dbPassword -}}
{{- if $existing -}}
{{- if hasKey $existing.data "POSTGRES_PASSWORD" -}}
{{- $dbPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $dbPassword -}}
{{- $dbPassword = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $databaseUrl := .Values.externalDatabase.url -}}
{{- if .Values.postgresql.enabled -}}
{{- $databaseUrl = printf "postgres://%s:%s@%s:5432/%s" (urlquery .Values.postgresql.auth.username) (urlquery $dbPassword) (include "opensiel.postgresServiceName" .) .Values.postgresql.auth.database -}}
{{- end -}}
{{- if not $databaseUrl -}}
{{- fail "set postgresql.enabled=true or externalDatabase.url" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opensiel.fullname" . }}
  labels:
    {{- include "opensiel.labels" . | nindent 4 }}
type: Opaque
data:
  OPENSIEL_MASTER_KEY: {{ $masterKey | b64enc | quote }}
  OPENSIEL_JWT_SECRET: {{ $jwtSecret | b64enc | quote }}
  DATABASE_URL: {{ $databaseUrl | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $dbPassword | b64enc | quote }}
  {{- end }}
{{- end }}
