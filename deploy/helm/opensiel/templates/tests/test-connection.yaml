apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opensiel.fullname" . }}-test-connection"
  labels:
    {{- include "opensiel.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - curl -fsS "http://{{ include "opensiel.fullname" . }}:{{ .Values.service.port }}/api/health"
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
