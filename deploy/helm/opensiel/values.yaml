replicaCount: 1

image:
  repository: ghcr.io/ibrahimhnif/opensiel
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8787

env:
  # Defaults to https://<first ingress host> when ingress is enabled,
  # otherwise http://localhost:<service.port>.
  OPENSIEL_PUBLIC_URL: ""
  OPENSIEL_ALLOW_SIGNUP: "true"
  OPENSIEL_AUTO_MIGRATE: "true"
  OPENSIEL_RATE_LIMIT: "true"

# Extra environment variables, for example OIDC, SAML, or AWS KMS.
extraEnv: []
#  - name: OPENSIEL_OIDC_ISSUER
#    value: https://accounts.google.com

secrets:
  # Use an existing Secret with DATABASE_URL, OPENSIEL_MASTER_KEY, and
  # OPENSIEL_JWT_SECRET. Requires postgresql.enabled=false.
  existingSecret: ""
  # Leave empty to generate once and preserve across upgrades.
  masterKey: ""
  jwtSecret: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    username: opensiel
    database: opensiel
    # Leave empty to generate once and preserve across upgrades.
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 8Gi
  podSecurityContext:
    fsGroup: 999
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalDatabase:
  # Required when postgresql.enabled=false.
  url: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opensiel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

nodeSelector: {}
tolerations: []
affinity: {}
