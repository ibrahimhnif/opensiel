name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensiel:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opensiel:latest

  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @liostech/opensiel-sdk build
      - name: Publish @liostech/opensiel-sdk
        working-directory: packages/sdk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@liostech/opensiel-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@liostech/opensiel-sdk@$VERSION is already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
