name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensiel:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opensiel:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/opensiel:latest

  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @liostech/opensiel-sdk build
      - name: Publish @liostech/opensiel-sdk
        working-directory: packages/sdk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@liostech/opensiel-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@liostech/opensiel-sdk@$VERSION is already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @liostech/opensiel-cli build
      - name: Publish @liostech/opensiel-cli
        working-directory: apps/cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@liostech/opensiel-cli@$VERSION" version >/dev/null 2>&1; then
            echo "@liostech/opensiel-cli@$VERSION is already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Lint chart
        run: helm lint deploy/helm/opensiel
      - name: Package chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/opensiel \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
      - name: Push chart
        run: helm push dist/opensiel-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [image, chart, sdk, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
