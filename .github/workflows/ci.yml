name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opensiel
          POSTGRES_PASSWORD: opensiel
          POSTGRES_DB: opensiel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensiel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Check installer
        run: |
          bash -n apps/web/public/install.sh
          tmp="$(mktemp -d)"
          OPENSIEL_HOME="$tmp" bash apps/web/public/install.sh --no-start --port 18787
          grep -q '^OPENSIEL_MASTER_KEY=' "$tmp/.env"
          grep -q '^OPENSIEL_JWT_SECRET=' "$tmp/.env"
          rm -rf "$tmp"
      - run: node --check scripts/opensiel-action.mjs
      - run: pnpm test:action
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://opensiel:opensiel@localhost:5432/opensiel_test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: helm lint deploy/helm/opensiel
      - name: Render chart
        run: |
          helm template opensiel deploy/helm/opensiel --namespace opensiel > /tmp/opensiel.yaml
          grep -q 'kind: Deployment' /tmp/opensiel.yaml
          grep -q 'kind: StatefulSet' /tmp/opensiel.yaml
          helm template opensiel deploy/helm/opensiel --namespace opensiel \
            --set postgresql.enabled=false \
            --set externalDatabase.url='postgres://u:p@db:5432/opensiel' \
            > /tmp/opensiel-external.yaml
          grep -q 'kind: Deployment' /tmp/opensiel-external.yaml
          ! grep -q 'kind: StatefulSet' /tmp/opensiel-external.yaml

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opensiel:latest
            ghcr.io/${{ github.repository_owner }}/opensiel:${{ github.sha }}
